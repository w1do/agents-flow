# Несекретные настройки сервера и песочницы. Скопировать в config/harness.yaml (файл не коммитится).
# Токены, ключи и пароли сюда не пишутся: они задаются в ENV (см. .env.example).
# Поля с именами token, key, password, secret, apikey сервер отклоняет.
# Проекты (workspace) в этот файл не пишутся: они заводятся на сервере в консоли или через API
# /api/console/projects (project-catalog, D-65). Блок workspaces сервер отклоняет.

sandbox:
  # Логическое имя локальной машины агента.
  provider_id: local
  # Автор коммитов передаётся агенту только через env.
  git_author:
    name: agents-flow
    email: agents-flow@noreply.local
  # memory:
  #   embedding_ref: vault:CHANGE_ME/CHANGE_ME/CHANGE_ME
