# Несекретные настройки harness. Скопировать в config/harness.yaml (файл не коммитится).
# Токены, ключи и пароли сюда не пишутся: они задаются в ENV (см. .env.example).
# Поля с именами token, key, password, secret, apikey сервер отклоняет.

workspaces:
  - id: demo
    name: Демо-проект
    voice_aliases: ["демо", "демо-проект"]
    # Репозиторий workspace (D-60): провайдер github | gitlab. base_url по умолчанию — https://gitlab.com
    # (для github — https://github.com; GitHub Enterprise не поддержан). Самостоятельный GitLab — свой https-адрес.
    repo:
      provider: gitlab
      project: group/demo
      # base_url: https://gitlab.com
      # Ключ записи из vault (D-45): ссылка vault:<project>/<service>/<name>. Без него задача уходит в error,
      # а клон анонимный (только публичный репозиторий).
      # access_ref: vault:CHANGE_ME/CHANGE_ME/CHANGE_ME
    default_branch: main
    test_command: "pytest"
    agent: claude-code
    # Лимит ходов агента на задачу, 1…500 (D-38).
    agent_max_turns: 50

    # Пример workspace на GitHub: ключ записи — ссылка vault на главный ключ GitHub (fine-grained на
    # репозиторий — позже, D-60). Ссылка — заглушка, значение токена в файл не пишется.
    # - id: chistotyumen
    #   name: Чистотюмень
    #   voice_aliases: ["чистотюмень"]
    #   repo:
    #     provider: github
    #     project: w1do/chistotyumen
    #     access_ref: vault:CHANGE_ME/CHANGE_ME/CHANGE_ME

sandbox:
  # Id песочницы Novita, созданной вручную (заполняется на этапе mvp-06).
  provider_id: CHANGE_ME_SANDBOX_ID
  # Версии, закреплённые для bootstrap песочницы (D-38); меняются только вместе с кодом.
  claude_code_version: "2.1.292"
  openspec_version: "1.14.3"
  # Автор коммитов агента в песочнице (git config --global при bootstrap). По умолчанию — ниже.
  # git_author:
  #   name: agents-flow
  #   email: agents-flow@noreply.local
  # Память проекта в песочнице (D-47). Блок не задан — память выключена.
  # memory:
  #   # GitHub-репозиторий memory-agent (по умолчанию w1do/memory-agent).
  #   # repo: w1do/memory-agent
  #   # Полный sha коммита memory-agent (40 символов 0-9a-f), не тег (D-51).
  #   ref: CHANGE_ME_40_HEX_COMMIT_SHA
  #   # Ключ embeddings из vault; без поля поиск лексический.
  #   embedding_ref: vault:CHANGE_ME/CHANGE_ME/CHANGE_ME
