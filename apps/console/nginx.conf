# Консоль оператора: статика SPA и проксирование API сервера в той же compose-сети.
# Наружу порт не публикуется: домен выставляет Dokploy поверх expose: 80.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API и health идут на сервер без изменения пути: `/api/...` остаётся `/api/...`.
    location /api/ {
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite кладёт файлы с хешем в имени: их можно кешировать навсегда.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html и маршруты SPA не кешируются, иначе после деплоя браузер получит старые ссылки на assets.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
