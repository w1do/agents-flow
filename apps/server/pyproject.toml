[project]
name = "harness-server"
version = "0.1.0"
description = "agents-flow harness: сервер, worker, CLI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "harness-shared",
    # Точная версия: сигнатуры AsyncSandbox сверены с этой сборкой (D-35).
    "novita-sandbox==2.1.1",
]

[project.scripts]
harness-server = "harness_server.cli:app"

[tool.uv.sources]
harness-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
