# CI: check → build → deploy. Remote проекта — GitHub, поэтому пайплайн GitLab не проверен на MR.
# Переменные GitLab: только DOKPLOY_WEBHOOK_URL и встроенные CI_REGISTRY_*.

stages:
  - check
  - build
  - deploy

.mr-or-default-branch: &mr-or-default-branch
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

check:python:
  stage: check
  interruptible: true
  image: ghcr.io/astral-sh/uv:0.13.1-python3.12-bookworm-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: harness_test
    POSTGRES_USER: harness
    # Только для CI: пароль не нужен, сервис недоступен извне. Локально — testcontainers.
    POSTGRES_HOST_AUTH_METHOD: trust
    TEST_DATABASE_URL: postgresql+asyncpg://harness@postgres:5432/harness_test
    UV_CACHE_DIR: .uv-cache
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  script:
    - uv sync --frozen
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy apps shared
    - uv run pytest
  <<: *mr-or-default-branch

check:openspec:
  stage: check
  image: node:22-slim
  script:
    - npx -y @fission-ai/openspec@1.14.3 validate --all
  <<: *mr-or-default-branch

build:image:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker buildx create --use --driver docker-container
    - >
      docker buildx build --push
      --cache-from type=registry,ref=$CI_REGISTRY_IMAGE:buildcache
      --cache-to type=registry,ref=$CI_REGISTRY_IMAGE:buildcache,mode=max
      -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
      -t $CI_REGISTRY_IMAGE:main
      .
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:dokploy:
  stage: deploy
  image: curlimages/curl:8.10.1
  needs:
    - build:image
  script:
    - curl -fsS --max-time 30 -X POST "$DOKPLOY_WEBHOOK_URL"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
