[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-flow-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi", "uvicorn", "sqlalchemy>=2,<3", "alembic", "psycopg[binary]",
    "pydantic>=2,<3", "pydantic-settings", "pyjwt", "bcrypt", "httpx", "mcp",
    "pytest", "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
