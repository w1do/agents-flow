# Стек Dokploy: postgres → migrate → server, плюс console (статика и прокси API).
# Один `docker compose up` поднимает всё локально; в Dokploy Postgres тоже из этого стека.
# Наружу порты не публикуются: домен и HTTPS выставляет Dokploy поверх expose.

x-harness-common: &harness-common
  # Dokploy собирает образ из git по Dockerfile: реестра пока нет (GitLab CI не запускался, D-59).
  # Локальный тег общий для migrate и server: Compose собирает его один раз. Когда появится
  # реестр GitLab, HARNESS_IMAGE задаётся в ENV Dokploy, и сборка не нужна.
  build:
    context: .
    dockerfile: Dockerfile
  image: ${HARNESS_IMAGE:-agents-flow:local}
  environment:
    # DATABASE_URL из ENV Dokploy (или .env) переопределяет адрес встроенного postgres.
    # Пароль обязателен и в URL подставляется как есть: используйте без `@ : / ? # %`.
    DATABASE_URL: &database-url ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-harness}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-harness}}
    HARNESS_CONFIG: /app/config/harness.yaml
    HARNESS_SECRET_KEY: ${HARNESS_SECRET_KEY:-}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    TELEGRAM_API_URL: ${TELEGRAM_API_URL:-}
    TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
    # Опциональные ENV: используются этапами, которые их вводят (см. ARCHITECTURE.md §9).
    HARNESS_PUBLIC_URL: ${HARNESS_PUBLIC_URL:-}
    HARNESS_ADMIN_TOKEN: ${HARNESS_ADMIN_TOKEN:-}
    POLZA_AI_URL: ${POLZA_AI_URL:-}
    POLZA_AI_KEY: ${POLZA_AI_KEY:-}
    POLZA_AI_MODEL: ${POLZA_AI_MODEL:-}
    ROUTING_MIN_CONFIDENCE: ${ROUTING_MIN_CONFIDENCE:-}
    STT_PROVIDER: ${STT_PROVIDER:-}
    STT_API_URL: ${STT_API_URL:-}
    STT_API_KEY: ${STT_API_KEY:-}
    STT_MODEL: ${STT_MODEL:-}
    CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    AGENT_RUN_TIMEOUT_MIN: ${AGENT_RUN_TIMEOUT_MIN:-}
    TESTS_TIMEOUT_MIN: ${TESTS_TIMEOUT_MIN:-}
    ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    WORKER_POLL_INTERVAL_SEC: ${WORKER_POLL_INTERVAL_SEC:-}
    VOICE_MAX_BYTES: ${VOICE_MAX_BYTES:-}
    AGENT_POLL_INTERVAL_SEC: ${AGENT_POLL_INTERVAL_SEC:-}
    # Vault с ключами владельца (D-45): без этих ENV ссылки vault:… не разрешаются.
    VAULT_MCP_URL: ${VAULT_MCP_URL:-}
    VAULT_MCP_TOKEN: ${VAULT_MCP_TOKEN:-}
  # Конфиг сервера зашит в образ (config/harness.example.yaml): секретов в нём нет, File Mount не нужен.
  # default — внутренняя сеть стека, по имени `postgres` и `server`; dokploy-network — для маршрутизации Dokploy.
  networks:
    - default
    - dokploy-network

services:
  postgres:
    image: postgres:16-alpine
    # Только внутренняя сеть стека (default): порты не публикуются, Dokploy-сеть не нужна.
    # Стек, который уже работает с deploy/db, этим сервисом не заменяется: см. docs/deployment.md.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-harness}
      POSTGRES_USER: ${POSTGRES_USER:-harness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    <<: *harness-common
    # Миграции нужен только DATABASE_URL: остальные секреты в контейнер migrate не передаются.
    environment:
      DATABASE_URL: *database-url
    command: ["harness-server", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    <<: *harness-common
    # --host 0.0.0.0 обязателен: по умолчанию serve слушает только localhost.
    command: ["harness-server", "serve", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  console:
    # Контекст — корень репозитория: Dockerfile консоли копирует packages/shared-types.
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    # Порт наружу не публикуется: домен и HTTPS выставляет Dokploy на сервис console, порт 80.
    expose:
      - "80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - default
      - dokploy-network
    restart: unless-stopped

volumes:
  pgdata:

networks:
  dokploy-network:
    external: true
